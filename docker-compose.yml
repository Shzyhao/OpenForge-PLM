# OpenForge PLM 本地开发依赖
# 用法: docker compose up -d
# M1 阶段最小集: PostgreSQL + Redis + MinIO
# 后续里程碑按需启用注释掉的组件

services:

  postgres:
    image: postgres:16-alpine
    container_name: openforge-pg
    environment:
      POSTGRES_USER: openforge
      POSTGRES_PASSWORD: openforge
      POSTGRES_DB: openforge
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: openforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openforge
      MINIO_ROOT_PASSWORD: openforge123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== 以下组件按里程碑启用 =====

