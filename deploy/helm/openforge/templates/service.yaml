{{- range .Values.services }}
{{- $svc := . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "openforge.labels" (dict "name" $svc.name "Chart" $.Chart) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
  template:
    metadata:
      labels:
        {{- include "openforge.labels" (dict "name" $svc.name "Chart" $.Chart) | nindent 8 }}
    spec:
      containers:
        - name: {{ $svc.name }}
          image: "{{ $.Values.global.imageRegistry }}{{ $svc.module }}:{{ $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- include "openforge.javaEnv" (dict "name" $svc.name "port" $svc.port "Values" $.Values "Chart" $.Chart) | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "openforge.labels" (dict "name" $svc.name "Chart" $.Chart) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $svc.name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
