# v1.23 R20：dev EVENT_BUS 真栈 broker 配置
# brokerIP1=127.0.0.1——broker 向客户端通告的地址；Docker Desktop 下容器 IP 宿主不可路由，
# 不改则宿主机 JVM 拿到 172.x 地址后 producer/consumer 全部连不上
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
listenPort = 10911
deleteWhen = 04
fileReservedTime = 48
flushDiskType = ASYNC_FLUSH
# dev 便捷：事件 topic（openforge-task 等）未预建时自动创建；生产须关闭并显式建 topic
autoCreateTopicEnable = true
