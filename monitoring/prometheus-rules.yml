# OpenForge 最小告警规则集（R15 交付：技术债「Grafana 看板告警规则」的可落地件）
# 用法：prometheus.yml 追加 rule_files 挂载本文件；通知渠道（邮件/webhook/钉钉）随部署环境在
# Alertmanager 侧配置——本文件只定义触发规则，与渠道解耦。
# 阈值依据：性能画像 §8（RSS 基线 189~220MB/服务）、DLQ 语义（PENDING 积压=触发失败待人工）。
groups:
  - name: openforge-availability
    rules:
      # 服务存活：任一 JVM 服务抓取失联（up==0 持续 1 分钟）
      - alert: OpenForgeServiceDown
        expr: up{job=~"openforge-.*"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "服务失联: {{ $labels.job }}"
          description: "{{ $labels.job }} 连续 1 分钟不可抓取（进程退出或网络隔离）。"

      # 网关 5xx 突增：5 分钟错误率超 5%（网关侧有全量路由流量）
      - alert: OpenForgeGatewayHigh5xx
        expr: >
          sum(rate(http_server_requests_seconds_count{job="openforge-gateway", status=~"5.."}[5m]))
          / sum(rate(http_server_requests_seconds_count{job="openforge-gateway"}[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "网关 5xx 率超 5%"
          description: "近 5 分钟网关 5xx 占比 {{ $value | humanizePercentage }}，疑似上游故障或路由异常。"

      # 模块路由退化：注册表 BROKEN/missing（gateway 自检指标，#92 可观测性）
      - alert: OpenForgeModuleBroken
        expr: openforge_gateway_broken_modules > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "模块路由 BROKEN"
          description: "存在依赖未启用的 BROKEN 模块（/actuator/module-routes 可见），检查模块依赖链。"

  - name: openforge-capacity
    rules:
      # 单服务 RSS 越界：基线 189~220MB（画像 §8），>400MB 持续 10 分钟=泄漏信号
      - alert: OpenForgeJvmRssHigh
        expr: process_resident_memory_bytes{job=~"openforge-.*"} > 4.2e8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM RSS 越界: {{ $labels.job }}"
          description: "{{ $labels.job }} RSS {{ $value | humanize1024 }}B 超过 400MB 上界（基线 ~200MB），排查泄漏。"

      # PG 连接池饱和：Hikari pending 线程 > 0 持续 5 分钟（dev 池=2，prod 按容量调阈值）
      - alert: OpenForgeHikariPending
        expr: hikaricp_connections_pending{job=~"openforge-.*"} > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "连接池排队: {{ $labels.job }}"
          description: "{{ $labels.job }} Hikari 有等待线程，池容量不足或慢查询阻塞。"

  - name: openforge-integration
    rules:
      # 死信积压：PENDING 死信 > 0 持续 15 分钟（触发失败待人工重放/丢弃）
      - alert: OpenForgeDlqBacklog
        expr: openforge_connector_dlq_pending > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "连接器死信积压"
          description: "PENDING 死信待处理（重放或丢弃），事件/定时触发持续失败。"
