spring:
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:openforge-metadata.yml}   # 保留开关式 import：回路测试经 NACOS_CONFIG_ENABLED=true 激活
  cloud:
    nacos:
      config:
        # test yml 整体遮蔽主 yml，enabled:false 默认值随之丢失——nacos 客户端在所有测试
        # 上下文实例化，JVM 退出时每上下文 destroy 阻塞 ~10s（CI 曾拖满 surefire 30s 强杀）
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
  datasource:
    url: jdbc:h2:mem:metadatatest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    table: flyway_metadata_history

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

openforge:
  security:
    auth-base-url: http://localhost:0   # 测试中权限查询走 MockBean/免检路径，不实际调用
    internal-token: test-internal-token

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  defaults:
    metrics:
      export:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
