spring:
  datasource:
    url: jdbc:h2:mem:metadatatest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    table: flyway_metadata_history

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

openforge:
  security:
    auth-base-url: http://localhost:0   # 测试中权限查询走 MockBean/免检路径，不实际调用
    internal-token: test-internal-token

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  defaults:
    metrics:
      export:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
