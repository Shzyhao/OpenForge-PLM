server:
  port: 8088
  tomcat:
    threads:
      max: 20        # 显式限流（默认 200；9 服务线程栈内存不可忽视）
      min-spare: 5

spring:
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:openforge-metadata.yml}   # B1 配置中心：optional=断连不阻塞启动
  application:
    name: openforge-metadata
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}   # F1 尾：默认关闭；dev-up.sh NACOS=1 开启
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}   # B1：默认关闭；远程配置覆盖本地（openforge-<svc>.yml）
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:openforge}
    username: ${PG_USER:openforge}
    password: ${PG_PASSWORD:openforge}
    hikari:
      maximum-pool-size: 5   # 9 服务×10 默认=90 连接，逼近 PG max_connections=100
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_metadata_history   # 多服务共享库，独立迁移历史

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

openforge:
  security:
    auth-base-url: ${AUTH_SERVICE_URI:http://localhost:8081}
    internal-token: ${INTERNAL_TOKEN:openforge-internal-dev-token}
  metadata:
    # 发布元数据 TTL 缓存（秒）：动态记录每请求 2 次元数据查询的承接；0=关闭；发布事务 afterCommit 驱逐
    cache-ttl-seconds: ${META_CACHE_TTL_SECONDS:30}

management:
  metrics:
    export:
      defaults:
        enabled: true   # B3: 显式开启（防环境级默认关闭），prometheus 端点随 exposure 生效
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
