# mono 单进程聚合配置（刀 1 骨架，docs/OpenForge-mono单进程设计.md §3.2）
# = 8 个服务 application.yml 的并集（同名键取值不变），差异点：
#   server.port 8090（8 服务合一）/ spring.application.name=openforge-mono /
#   flyway.enabled=false（多实例编排见 MonoFlywayConfig）/ Hikari 单池 /
#   内部调用 base-url 默认指向本进程回环（原各自直连 808x）
server:
  port: ${MONO_PORT:8090}
  tomcat:
    threads:
      # 40 而非 20：权限拦截器 HTTP 回环（security 自动配置，60s 缓存失效瞬间）占用本进程
      # 线程——并发线程全阻塞等回环响应时互等死锁（评审实锤窗口），提量摊薄触发概率；
      # 根治需刀 2 直调（已判停，重启条件见 mono 设计 §3.2）
      max: ${TOMCAT_MAX_THREADS:40}
      min-spare: ${TOMCAT_MIN_SPARE:10}
  servlet:
    multipart:
      max-file-size: 100MB                 # doc 文件上传（原 doc 专属配置上移）
      max-request-size: 110MB

spring:
  application:
    name: openforge-mono                   # EventPublisher.producerName / 日志名（模块身份在注册表层面不变）
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:openforge-mono.yml}   # B1：optional=断连不阻塞；blank=彻底跳过 loader
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:openforge}
    username: ${PG_USER:openforge}
    password: ${PG_PASSWORD:openforge}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:8}   # 8 服务独立部署 9×5=45 连接 → mono 单池（≤10，PG max_connections 友好）
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  flyway:
    enabled: false                           # 逐模块 Flyway 实例（location/历史表各异）见 MonoFlywayConfig

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

openforge:
  # 模块描述符按模块加载（module/<svc>.yml ×8），实例编排见 MonoModuleRegistrarsConfig
  internal:
    # 接收方（InternalController）与调用方双源同 env——评审实锤键位漂移（两键全仓无 yml 定义，
    # INTERNAL_TOKEN 轮换曾致回环/注册全 401）
    token: ${INTERNAL_TOKEN:openforge-internal-dev-token}
  security:
    # mono 内部调用统一回环本进程（AUTH_SERVICE_URI 在独立部署语义下仍可注入覆盖）
    auth-base-url: ${AUTH_SERVICE_URI:http://localhost:${server.port}}
    internal-token: ${INTERNAL_TOKEN:openforge-internal-dev-token}
    # 自助注册默认关闭：用户由管理员手动创建（权限完善方案 D8）——原 auth 配置
    open-registration: ${OPEN_REGISTRATION:false}
    password-expiry-days: ${PASSWORD_EXPIRY_DAYS:180}
    password-expiring-soon-days: ${PASSWORD_EXPIRING_SOON_DAYS:7}
    login-max-failures: 5
    login-lock-minutes: 15
    log-retention-days: ${LOG_RETENTION_DAYS:180}
    log-retention-cron: ${LOG_RETENTION_CRON:0 30 3 * * *}
  jwt:
    secret: ${JWT_SECRET:openforge-dev-secret-key-change-me-in-production-0001}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  doc:
    storage-dir: ${DOC_STORAGE_DIR:./data/doc-files}
  knowledge:
    vector-store: ${KNOWLEDGE_VECTOR_STORE:memory}
  llm:
    base-url: ${OPENFORGE_LLM_BASE_URL:}
    api-key: ${OPENFORGE_LLM_API_KEY:}
    embedding-model: ${OPENFORGE_LLM_EMBEDDING_MODEL:embedding-3}
  metadata:
    cache-ttl-seconds: ${META_CACHE_TTL_SECONDS:30}
  workflow:
    base-url: ${WORKFLOW_SERVICE_URI:http://localhost:${server.port}}
  integration:
    knowledge-base-url: ${KNOWLEDGE_SERVICE_URI:http://localhost:${server.port}}
    ai-base-url: ${OPENFORGE_AI_BASE_URL:http://localhost:8001}   # Python AI 网关恒进程外（设计 §1 非目标）

management:
  metrics:
    export:
      defaults:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
