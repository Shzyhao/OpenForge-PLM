spring:
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:openforge-material.yml}   # 与主 yml 同步：nacos-config 在 classpath 时缺 import 即启动失败
  datasource:
    url: jdbc:h2:mem:materialtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    table: flyway_material_history

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

openforge:
  security:
    auth-base-url: http://localhost:0   # 测试中 NumberClient 被 MockBean 替换，不实际调用
    internal-token: test-internal-token
