spring:
  config:
    import: ${NACOS_CONFIG_IMPORT:}   # 怪癖修复（B1）：enabled=false 不拦截 NacosConfigDataLoader（空载连接 ~1s/上下文，CI 实证）——blank import 才彻底跳过；回路测试经 NACOS_CONFIG_IMPORT 显式打开
  cloud:
    nacos:
      config:
        # test yml 整体遮蔽主 yml，enabled:false 默认值随之丢失——nacos 客户端在所有测试
        # 上下文实例化，JVM 退出时每上下文 destroy 阻塞 ~10s（CI 曾拖满 surefire 30s 强杀）
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
  datasource:
    url: jdbc:h2:mem:materialtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    table: flyway_material_history

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

openforge:
  security:
    auth-base-url: http://localhost:0   # 测试中 NumberClient 被 MockBean 替换，不实际调用
    internal-token: test-internal-token
