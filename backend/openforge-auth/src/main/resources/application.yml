server:
  port: 8081
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:20}        # 显式限流（默认 200；9 服务线程栈内存不可忽视）
      min-spare: ${TOMCAT_MIN_SPARE:5}

spring:
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:openforge-auth.yml}   # B1 配置中心：optional=断连不阻塞启动
  application:
    name: openforge-auth
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}   # F1 尾：默认关闭；dev-up.sh NACOS=1 开启
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}   # B1：默认关闭；远程配置覆盖本地（openforge-<svc>.yml）
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:openforge}
    username: ${PG_USER:openforge}
    password: ${PG_PASSWORD:openforge}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:5}   # 9 服务×10 默认=90 连接，逼近 PG max_connections=100
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

openforge:
  security:
    # 自助注册默认关闭：用户由管理员手动创建（权限完善方案 D8）
    open-registration: ${OPEN_REGISTRATION:false}
    # 密码有效期（天）与临期提醒窗口（天）——方案 E2
    password-expiry-days: ${PASSWORD_EXPIRY_DAYS:180}
    password-expiring-soon-days: ${PASSWORD_EXPIRING_SOON_DAYS:7}
    # 登录失败锁定（方案 E9）
    login-max-failures: 5
    login-lock-minutes: 15
    # 登录/审计日志保留期（技术债清理：每日 03:30 分批删除超期记录；0=关闭）
    log-retention-days: ${LOG_RETENTION_DAYS:180}
    log-retention-cron: ${LOG_RETENTION_CRON:0 30 3 * * *}
  jwt:
    # 仅供本地开发；生产环境必须通过环境变量覆盖（>=32 字节）
    secret: ${JWT_SECRET:openforge-dev-secret-key-change-me-in-production-0001}
    ttl-minutes: ${JWT_TTL_MINUTES:120}

management:
  metrics:
    export:
      defaults:
        enabled: true   # B3: 显式开启（防环境级默认关闭），prometheus 端点随 exposure 生效
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
