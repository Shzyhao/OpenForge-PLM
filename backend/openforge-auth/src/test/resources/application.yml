spring:
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:openforge-auth.yml}   # 与主 yml 同步：nacos-config 在 classpath 时缺 import 即启动失败
  datasource:
    url: jdbc:h2:mem:authtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

openforge:
  security:
    open-registration: true   # 注册逻辑单测需要；默认关闭语义由专项测试验证
  jwt:
    secret: test-secret-key-for-unit-tests-32-bytes-min!!
    ttl-minutes: 120
