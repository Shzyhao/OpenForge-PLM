spring:
  config:
    import: ${NACOS_CONFIG_IMPORT:}   # 怪癖修复（B1）：blank import 才彻底跳过 NacosConfigDataLoader
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
  datasource:
    url: jdbc:h2:mem:drwtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    table: flyway_drawing_history

openforge:
  security:
    auth-base-url: http://localhost:0
    internal-token: test-internal-token
  drawing:
    storage-dir: ./target/test-drawing-files
