server:
  port: 8083

spring:
  application:
    name: openforge-doc
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}   # F1 尾：默认关闭；dev-up.sh NACOS=1 开启
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:openforge}
    username: ${PG_USER:openforge}
    password: ${PG_PASSWORD:openforge}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_doc_history
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

openforge:
  security:
    auth-base-url: ${AUTH_SERVICE_URI:http://localhost:8081}
    internal-token: ${INTERNAL_TOKEN:openforge-internal-dev-token}
  doc:
    # 本地磁盘存储（M2）；M3 换 MinIO（架构文档 7.1）
    storage-dir: ${DOC_STORAGE_DIR:./data/doc-files}

management:
  metrics:
    export:
      defaults:
        enabled: true   # B3: 显式开启（防环境级默认关闭），prometheus 端点随 exposure 生效
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
