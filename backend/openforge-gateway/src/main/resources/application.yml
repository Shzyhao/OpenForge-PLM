server:
  port: 8080

spring:
  application:
    name: openforge-gateway
  cloud:
    gateway:
      routes:
        # 内核兜底路由（A4 设计 4）：仅保留 auth——注册中心宿主，必须永远可达；
        # 其余业务前缀一律由模块注册表动态生成（ModuleRouteRefresher，30s 轮询）。
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**,/api/v1/orgs/**,/api/v1/numbers/**,/api/v1/security/**,/api/v1/modules/**

openforge:
  jwt:
    # 与 auth 服务共享（环境变量 JWT_SECRET 注入；M2 演进 RS256 后网关只持公钥）
    secret: ${JWT_SECRET:openforge-dev-secret-key-change-me-in-production-0001}
  security:
    whitelist: /api/v1/auth/login,/api/v1/auth/register,/actuator/**
  module:
    auth-base-url: ${AUTH_SERVICE_URI:http://localhost:8081}
    internal-token: ${INTERNAL_TOKEN:openforge-internal-dev-token}
    poll-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,module-routes
