server:
  port: 8080

spring:
  application:
    name: openforge-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: material-service
          uri: ${MATERIAL_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/parts/**,/api/v1/part-categories/**,/api/v1/boms/**
        - id: doc-service
          uri: ${DOC_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/docs/**
        - id: workflow-service
          uri: ${WORKFLOW_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/workflow/**
        - id: change-service
          uri: ${CHANGE_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/changes/**
        - id: ai-gateway
          uri: ${AI_GATEWAY_URI:http://localhost:8001}
          predicates:
            - Path=/api/v1/ai/**
        - id: knowledge-service
          uri: ${KNOWLEDGE_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/knowledge/**
        - id: project-service
          uri: ${PROJECT_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/projects/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

openforge:
  jwt:
    # 与 auth 服务共享（环境变量 JWT_SECRET 注入；M2 演进 RS256 后网关只持公钥）
    secret: ${JWT_SECRET:openforge-dev-secret-key-change-me-in-production-0001}
  security:
    whitelist:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /actuator/**
