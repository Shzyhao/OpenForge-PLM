server:
  port: 8080

spring:
  application:
    name: openforge-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

openforge:
  jwt:
    # 与 auth 服务共享（环境变量 JWT_SECRET 注入；M2 演进 RS256 后网关只持公钥）
    secret: ${JWT_SECRET:openforge-dev-secret-key-change-me-in-production-0001}
  security:
    whitelist:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /actuator/**
