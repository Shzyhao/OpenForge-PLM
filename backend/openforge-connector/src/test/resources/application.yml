spring:
  datasource:
    url: jdbc:h2:mem:connectortest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    table: flyway_connector_history

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

openforge:
  security:
    auth-base-url: http://localhost:0
    internal-token: test-internal-token
  connector:
    # 测试固定主密钥（32 字节全 0 的 Base64，仅供测试）
    master-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    # 测试白名单：本机 mock 服务器；放开私网（loopback）
    egress-whitelist: localhost,127.0.0.1
    egress-allow-private: true
    trigger:
      # 测试加速调度重同步（默认 8s/30s）
      resync-initial-ms: 1000
      resync-ms: 3000
