server:
  port: 8086
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:20}        # 显式限流（默认 200；9 服务线程栈内存不可忽视）
      min-spare: ${TOMCAT_MIN_SPARE:5}

spring:
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:openforge-knowledge.yml}   # B1 配置中心：optional=断连不阻塞启动
  application:
    name: openforge-knowledge
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}   # F1 尾：默认关闭；dev-up.sh NACOS=1 开启
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}   # B1：默认关闭；远程配置覆盖本地（openforge-<svc>.yml）
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:openforge}
    username: ${PG_USER:openforge}
    password: ${PG_PASSWORD:openforge}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:5}   # 9 服务×10 默认=90 连接，逼近 PG max_connections=100
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration   # V2 (pgvector) 仅 PG 加载；H2 测试 flyway.target=1 跳过
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_knowledge_history

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

openforge:
  knowledge:
    vector-store: ${KNOWLEDGE_VECTOR_STORE:memory}   # memory（默认，H2/开发）| pgvector（生产，SQL 级租户过滤）
  security:
    auth-base-url: ${AUTH_SERVICE_URI:http://localhost:8081}
    internal-token: ${INTERNAL_TOKEN:openforge-internal-dev-token}
  llm:
    base-url: ${OPENFORGE_LLM_BASE_URL:}
    api-key: ${OPENFORGE_LLM_API_KEY:}
    embedding-model: ${OPENFORGE_LLM_EMBEDDING_MODEL:embedding-3}

management:
  metrics:
    export:
      defaults:
        enabled: true   # B3: 显式开启（防环境级默认关闭），prometheus 端点随 exposure 生效
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
